name: Website checks and review package
on:
  push:
    branches: [main, site-expansion]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check pages and prepare package
        run: python3 scripts/package_site.py
      - name: Save versioned review package
        uses: actions/upload-artifact@v4
        with:
          name: ether-review-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
